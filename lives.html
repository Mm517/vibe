<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>اللايفات | مجتمع الفايب كودينج</title><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#0A1730">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="plat.css"></head>
<body class="plt" data-p="lives"><main id="pg"><div class="sk" style="height:46px;width:240px;margin-bottom:20px"></div><div class="cg"><div class="sk" style="height:220px"></div><div class="sk" style="height:220px"></div><div class="sk" style="height:220px"></div></div></main>
<script src="config.js"></script><script src="vibe.js"></script><script src="shell.js"></script>
<script>

run(async()=>{const p=$('#pg'),H=pgHead('اللايفات','جلسات مباشرة مع المدرّس، وتسجيلها بعد ما تخلص.');p.innerHTML=H+SK(2,110);
 let LV;try{LV=await vget('aa_vc_lives?select=*&order=starts_at.desc&limit=60')}catch(_){p.innerHTML=H+'<div class="empty">تعذّر تحميل اللايفات.</div>';return}
 const now=LV.filter(l=>l.status==='live'),up=LV.filter(l=>l.status==='upcoming').sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at)),end=LV.filter(l=>l.status==='ended');
 setLive(now.length);
 const nowH=now.map(l=>`<div class="lv-now"><div class="tt"><i></i> لايف مباشر الآن: ${esc(l.title)}</div>${l.mode==='room'&&l.room?`<div class="pl" id="rm${l.id}"><div class="np"><div><p style="margin-bottom:12px">الاجتماع شغّال جوه الموقع (الكاميرا والمايك بإذنك)</p><button class="btn btn-w" data-room="${l.id}">ادخل الاجتماع الآن</button></div></div></div>`:(safeUrl(embedSrc(l.url))?`<div class="pl">${playerHTML(l.url)}</div>`:'<p>الرابط هيتضاف حالًا.</p>')}</div>`).join('');
 const row=(l,k)=>{const d=new Date(l.starts_at);return `<div class="lvr"><div class="lvd"><b>${nf.format(d.getDate())}</b><span>${d.toLocaleDateString('ar-EG',{month:'short'})}</span></div><div class="lvb"><small>${fdt(l.starts_at)}</small><h3>${esc(l.title)}</h3>${l.description?`<p>${esc(l.description)}</p>`:''}</div>
  <div>${k==='u'?(l.mode==='room'?'<span class="chip g">اجتماع داخل الموقع</span>':safeUrl(l.url)?`<a class="btn btn-o btn-s" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">رابط اللايف</a>`:'<span class="chip y">قريبًا</span>'):(safeUrl(l.replay_url)?`<a class="btn btn-p btn-s" href="${esc(l.replay_url)}" target="_blank" rel="noopener noreferrer">شاهد التسجيل</a>`:'<span class="chip">انتهى</span>')}</div></div>`};
 p.innerHTML=H+nowH+`<h2 class="sec-t" style="margin-top:0">اللايفات القادمة</h2><div class="stack">${up.length?up.map(l=>row(l,'u')).join(''):'<div class="empty">مفيش لايفات قادمة دلوقتي. هتظهر هنا أول ما تتحدد.</div>'}</div>`
  +(end.length?`<h2 class="sec-t">لايفات سابقة</h2><div class="stack">${end.map(l=>row(l,'e')).join('')}</div>`:'');
 p.onclick=e=>{const b=e.target.closest('[data-room]');if(!b)return;const l=now.find(x=>x.id==b.dataset.room);if(l)jitsiJoin($('#rm'+l.id),l)}});

</script></body></html>
